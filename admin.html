<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin Shopee Clone</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
.sidebar{
    width:250px;
}
</style>

</head>

<body class="bg-gray-100">

<div class="flex">

    <!-- Sidebar -->
    <aside class="sidebar bg-orange-600 min-h-screen text-white">

        <div class="text-center text-2xl font-bold py-6 border-b border-orange-500">
            Admin Shopee
        </div>

        <nav class="mt-6">

            <a href="#" class="block px-6 py-3 hover:bg-orange-700">
                <i class="fa fa-chart-line mr-2"></i> Dashboard
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-orange-700">
                <i class="fa fa-box mr-2"></i> Produk
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-orange-700">
                <i class="fa fa-cart-shopping mr-2"></i> Pesanan
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-orange-700">
                <i class="fa fa-users mr-2"></i> Pengguna
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-orange-700">
                <i class="fa fa-right-from-bracket mr-2"></i> Logout
            </a>

        </nav>

    </aside>

    <!-- Content -->
    <main class="flex-1 p-8">

        <h1 class="text-3xl font-bold mb-6">
            Dashboard Admin
        </h1>

        <!-- Statistik -->
        <div class="grid grid-cols-4 gap-6 mb-8">

            <div class="bg-white rounded shadow p-5">
                <p class="text-gray-500">Total Produk</p>
                <h2 class="text-3xl font-bold text-orange-600" id="totalProduk">6</h2>
            </div>

            <div class="bg-white rounded shadow p-5">
                <p class="text-gray-500">Pesanan</p>
                <h2 class="text-3xl font-bold text-blue-600">120</h2>
            </div>

            <div class="bg-white rounded shadow p-5">
                <p class="text-gray-500">Pengguna</p>
                <h2 class="text-3xl font-bold text-green-600">54</h2>
            </div>

            <div class="bg-white rounded shadow p-5">
                <p class="text-gray-500">Pendapatan</p>
                <h2 class="text-3xl font-bold text-red-600">
                    Rp12.500.000
                </h2>
            </div>

        </div>

        <!-- Form Produk -->

        <div class="bg-white rounded shadow p-5 mb-6">

            <h2 class="text-xl font-bold mb-4">
                Tambah Produk
            </h2>

            <div class="grid grid-cols-2 gap-4">

                <input id="nama" class="border p-2 rounded" placeholder="Nama Produk">

                <input id="harga" class="border p-2 rounded" placeholder="Harga">

                <input id="kategori" class="border p-2 rounded" placeholder="Kategori">

                <input id="gambar" class="border p-2 rounded" placeholder="URL Gambar">

            </div>

            <button onclick="tambahProduk()"
                class="bg-orange-600 text-white px-5 py-2 rounded mt-4">
                Tambah Produk
            </button>

        </div>

        <!-- Tabel Produk -->

        <div class="bg-white rounded shadow p-5">

            <h2 class="text-xl font-bold mb-4">
                Data Produk
            </h2>

            <table class="w-full">

                <thead class="bg-orange-600 text-white">

                <tr>

                    <th class="p-2">No</th>

                    <th>Nama</th>

                    <th>Kategori</th>

                    <th>Harga</th>

                    <th>Aksi</th>

                </tr>

                </thead>

                <tbody id="produkTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script>

let products=[
{
nama:"Kemeja Wanita",
kategori:"Pakaian",
harga:79000
},
{
nama:"Headphone Bluetooth",
kategori:"Elektronik",
harga:189000
},
{
nama:"Sneakers",
kategori:"Sepatu",
harga:135000
},
{
nama:"Tas Ransel",
kategori:"Aksesoris",
harga:98000
},
{
nama:"Jam Tangan",
kategori:"Aksesoris",
harga:165000
},
{
nama:"Serum Wajah",
kategori:"Kecantikan",
harga:59000
}
];

function renderProduk(){

let html="";

products.forEach((p,i)=>{

html+=`

<tr class="border-b">

<td class="p-3">${i+1}</td>

<td>${p.nama}</td>

<td>${p.kategori}</td>

<td>Rp ${p.harga.toLocaleString()}</td>

<td>

<button
onclick="hapus(${i})"
class="bg-red-500 text-white px-3 py-1 rounded">
Hapus
</button>

</td>

</tr>

`;

});

document.getElementById("produkTable").innerHTML=html;

document.getElementById("totalProduk").innerHTML=products.length;

}

function tambahProduk(){

let nama=document.getElementById("nama").value;

let harga=document.getElementById("harga").value;

let kategori=document.getElementById("kategori").value;

if(nama==""||harga==""||kategori==""){

alert("Lengkapi data");

return;

}

products.push({

nama,

harga,

kategori

});

renderProduk();

document.getElementById("nama").value="";
document.getElementById("harga").value="";
document.getElementById("kategori").value="";
document.getElementById("gambar").value="";

}

function hapus(index){

if(confirm("Hapus produk?")){

products.splice(index,1);

renderProduk();

}

}

renderProduk();

</script>

</body>
</html>
