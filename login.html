<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shopee Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-md shadow-lg max-w-sm w-full border-t-4 border-[#ee4d2d]">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-[#ee4d2d]">Shopee Clone</h2>
            <p class="text-xs text-gray-500 mt-1">Masuk ke akun Anda atau Dashboard Admin</p>
        </div>

        <form onsubmit="processLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Username / Email</label>
                <input type="text" id="loginUsername" required placeholder="Gunakan 'admin' untuk akses admin" 
                    class="w-full px-3 py-2 border rounded text-xs focus:outline-none focus:border-[#ee4d2d]">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="Masukkan password" 
                    class="w-full px-3 py-2 border rounded text-xs focus:outline-none focus:border-[#ee4d2d]">
            </div>
            <button type="submit" class="w-full bg-[#ee4d2d] text-white py-2.5 rounded font-bold text-xs uppercase hover:opacity-90 transition">
                Log In
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-gray-500 hover:underline">← Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        function processLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;

            // Simpan data user ke localStorage
            if (username.toLowerCase() === 'admin') {
                localStorage.setItem('shopeeUser', JSON.stringify({ name: 'Admin Shopee', role: 'admin' }));
                alert('Login berhasil sebagai Admin!');
                window.location.href = 'admin.html';
            } else {
                localStorage.setItem('shopeeUser', JSON.stringify({ name: username, role: 'user' }));
                alert(`Selamat datang, ${username}!`);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
